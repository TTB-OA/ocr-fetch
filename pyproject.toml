[project]
name = "ocr-fetch"
version = "0.1.0"
description = "Download files from URLs and convert documents (PDF, Office, HTML, images, spreadsheets) to Markdown/text"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "docx2txt>=0.9",
    "html2text>=2025.4.15",
    "mammoth>=1.12.0",
    "markitdown>=0.1.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "pdf2image>=1.17.0",
    "pillow>=11.0.0",
    "pypandoc>=1.16.2",
    "pypdf>=6.7.1",
    "pytesseract>=0.3.13",
    "requests>=2.32.5",
    "tabulate>=0.10.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_fetch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# fixtures/ holds sample documents; some match pytest's default test*.txt doctest glob
norecursedirs = ["fixtures", ".*", "build", "dist", "*.egg", "node_modules", ".venv"]
